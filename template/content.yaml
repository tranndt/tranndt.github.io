  expertise:
    icon: star
    title: Expertise
    subtitle: What I Do Best
    content:
      - name: Data Science
        icon: pulse
        description: >
          With 4+ years professional and academic research experience, Data Science is my strongest suit.<br><br>My proficiency in Machine Learning, Data Analysis and Visualization enables me to develop data-driven solutions that address real-world challenges and transform complex data into actionable insights.
      - name: Full Stack Development
        icon: desktop
        description: >
          As a certified IBM Full Stack Software Developer, I have a strong understanding of all aspects of building dynamic web applications.<br><br>My expertise with web frameworks, container, microservices and serverless technologies allows me to craft seamless user experiences while ensuring robust back-end functionality.
      - name: Software Development
        icon: settings
        description: >
          With a deep passion for software development, I excel in Object-Oriented Programming (OOP), Data Structures, and Agile Methodologies.<br><br>My experience with Android and iOS development, as well as game development, has honed my skills in creating high-quality software solutions that meet user needs.
      - name: Database Management
        icon: server
        description: >
          I bring extensive experience in data warehouse management, ETL processes, and cloud storage solutions.<br><br>My ability to engineer and manage large-scale databases ensures that customer data is not only secure but also readily accessible for driving business insights.

  timeline:
    icon: briefcase
    title: Timeline
    subtitle: My Journey So Far
    experience:
      title: Experience
      content:
        - year: 01/2024 - 07/2024
          position: Data Analyst
          company: DataAnnotation, Remote
          description: >
            In my latest venture, I dove into prompt engineering and collaborated closely with coding GPTs, making them smarter and more efficient.<br><br>In fine-tuning AI-generated code, I also honed my skills in assessing and crafting Python, JavaScript, and SQL code that directly improved GPT models.
        - year: 01/2022 - 12/2022
          position: Data Analytics Developer
          company: Manitoba Hydro, Winnipeg, MB
          description: >
            A proud moment in my journey where I got the opportunity to apply my Data Science expertise to build highly accurate ML-models for customer credit classification.<br><br>Working with massive datasets and building a cloud AI-driven solution that replaced an outdated system was a challenging but incredibly rewarding experience.
        - year: 05/2021 - 08/2021
          position: Undergraduate Research Assistant
          company: University of Manitoba's Database and Data Mining Lab, Winnipeg, MB
          description: >
            As part of my Summer Undergraduate Research award, I delved into the tasks of developing complex autoencoder neural networks that can predict COVID-19 based on early blood test results and in the absence of large training datasets.<br><br>Leading a full-cycle ML project that yielded meaningful results, multiple published research and additionally, winning first place in the Bison Transport's Nexus Data Challenge was altogether an unforgettable experience.
    education:
      title: Education
      content:
      - year: 08/2024
        degree: IBM Full Stack Software Developer Professional Certificate
        institution: Coursera
        description: >
          I immersed myself in full-stack development, mastering everything from Node.js, React, and Express to Docker and Kubernetes.<br><br>Gaining knowledge in building real-world projects, like a dealership reviews website and containerized apps, really expanded my skillset and makes the journey ahead incredibly exciting.
      - year: 08/2018 - 06/2023
        degree: "Bachelor of Computer Science (Honours Co-op), GPA: 4.05/4.50"
        institution: University of Manitoba, Winnipeg, MB
        description: >
          Completed a 5-year Co-op program with excellent grades and a strong foundation on Data Science, Machine Learning, and Software Development.<br><br>Was recognized for academic excellence, community involvement and leadership, including ICM Leadership Excellence Award (2020), Undergraduate Summer Research Award (2021), International Undergraduate Student Scholarship (2021), Dean's First Class Honors List (2023).

