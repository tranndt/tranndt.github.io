  about:
    icon: user
    title: About
    subtitle: Who is Jase Tran?
    prelude: A Software Developer, Data Analyst, and Full Stack Developer, among others!
    description: >
      I'm a curious and enthusiastic <span style="font-weight: medium; color: var(--primary-color)">Computer Science graduate from the University of Manitoba</span>, who believes in the power of data and software to make the world a better place. I've spent time as a <span style="font-weight: medium; color: var(--primary-color)">Data Analytics Developer at Manitoba Hydro</span>, where I got to flex my data engineering muscles and solve real-world problems with cutting-edge technology.
      <br><br>
      I'm also a <span style="font-weight: medium; color: var(--primary-color)">certified IBM Full Stack Software Developer</span>, which means I'm just as comfortable building the front end of a website as I am crunching numbers on the back end. Outside of work, I'm a tech explorer, always on the lookout for the next cool project. Ready to dive into the world of code and data with me? Let's make something amazing!
    content:
      - My full legal name is <b>Nguyen Duy Thong Tran 👩🏻‍💼🇻🇳</b>.
      - I just recently celebrated my <b>24th birthday 🎉</b> in March 2024.
      - My pronouns are <b>she/her 🏳️‍⚧️</b>.
      - I'm currently based in <b>Winnipeg, MB, Canada 🇨🇦</b>.
      - When I'm not coding, you can find me <b>enjoying the outdoors 🚴🏻‍♀️, playing sports 🏸, or petting my cat 🐱</b>.
    image: "../assets/img/profile.jpg"
    links:
      - name: My Resume
        icon: file
        url: https://umanitoba-my.sharepoint.com/:b:/g/personal/tranndt_myumanitoba_ca/EZmAoX3gkQ5BmE5RqwzUsKsBKIt9prFZ_ozfMis5ZGpQ-w?e=rBhcgB
